name: Apply Brainz Calc print material rates

on:
  push:
    branches: [main]

jobs:
  update-rates:
    if: contains(github.event.head_commit.message, '[rates-sync]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Apply print material rates and refresh offline cache
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "index.html": (
                  '<option value="sav" data-rate="2.30">SAV – GHS 2.30/sq ft</option>',
                  '<option value="sav" data-rate="2.30">SAV – GHS 2.30/sq ft</option>\n'
                  '                  <option value="one-way-vision" data-rate="7.00">One way vision – GHS 7.00/sq ft</option>\n'
                  '                  <option value="transparent-sticker" data-rate="4.00">Transparent Sticker – GHS 4.00/sq ft</option>'
              ),
              "script.js": (
                  '  const PRINT_RATE = {\n    flexy: 2.5,\n    sav: 2.3\n  };',
                  '  const PRINT_RATE = {\n    flexy: 2.5,\n    sav: 2.3,\n    "one-way-vision": 7,\n    "transparent-sticker": 4\n  };'
              ),
              "service-worker.js": (
                  'const CACHE_NAME = "brainz-calc-v2";',
                  'const CACHE_NAME = "brainz-calc-v3";'
              )
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one target in {filename}; found {count}")
              path.write_text(content.replace(old, new), encoding="utf-8")
          PY
      - name: Commit app update
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js service-worker.js
          git commit -m "Add print material rates"
          git push
